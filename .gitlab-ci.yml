stages:
  - lint
  - unit_tests
  - integration_tests

variables:
  ANDROID_HOME: "/opt/android-sdk-linux"
  ANDROID_SDK_ROOT: "/opt/android-sdk-linux"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/

lint:
  stage: lint
  image: ghcr.io/cirruslabs/android-sdk:35
  script:
    - ./gradlew ktlintCheck

unit_tests:
  image: ghcr.io/cirruslabs/android-sdk:35
  stage: unit_tests
  before_script:
    - echo "Cert path:"
    - echo "$SERVER_CERT_BASE64"
    - ls -l "$SERVER_CERT_BASE64" || echo "Cert file not found"
    - mkdir -p app/src/main/res/raw
    - cp "$SERVER_CERT_BASE64" app/src/main/res/raw/server_cert.pem
    - chmod +x ./gradlew
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    - cat local.properties
    - ./gradlew --version
  script:
    - ./gradlew clean testDebugUnitTest --stacktrace
    - cat app/build/reports/tests/testDebugUnitTest/index.html || echo "No test report found"
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/
      - app/build/
  artifacts:
    when: always
    paths:
      - app/build/reports/tests/testDebugUnitTest/
    expire_in: 1 week

integration_tests:
  image: reactivecircus/android-emulator-30
  stage: integration_tests
  before_script:
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    - ./gradlew --version
    - emulator -avd test -no-window -no-audio -no-boot-anim -gpu off &
    - adb wait-for-device
    - |
      until adb shell getprop sys.boot_completed | grep -m 1 '1'; do
        echo "Waiting for emulator to finish booting..."
        sleep 5
      done
    - adb shell input keyevent 82 &
    - ./gradlew clean assembleDebug
  script:
    - ./gradlew connectedDebugAndroidTest --stacktrace
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/
      - app/build/
  artifacts:
    when: always
    paths:
      - app/build/reports/androidTests/connected/
    expire_in: 1 week