image: openjdk:11-jdk

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  ANDROID_HOME: "/usr/local/android-sdk"
  PATH: "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

before_script:
  - apt-get --quiet update --yes
  - apt-get --quiet install --yes wget tar unzip lib32stdc++6 lib32z1
  - wget --quiet --output-document=android-sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
  - unzip -q android-sdk.zip -d $ANDROID_HOME/cmdline-tools
  - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
  - echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3" "platform-tools" "ndk-bundle"
  - export PATH=$PATH:$ANDROID_HOME/platform-tools

stages:
  - build
  - test

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/
    - app/build/

build:
  stage: build
  script:
    - ./gradlew clean assembleDebug --stacktrace
  artifacts:
    paths:
      - app/build/outputs/apk/debug/
    expire_in: 1 hour

unit_tests:
  stage: test
  script:
    - ./gradlew testDebugUnitTest --stacktrace
  artifacts:
    when: always
    paths:
      - app/build/reports/tests
      - app/build/test-results/
    expire_in: 1 hour