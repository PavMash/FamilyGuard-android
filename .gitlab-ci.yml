stages:
  - lint
  - unit_tests
  - integration_tests

variables:
  ANDROID_HOME: "/opt/android-sdk-linux"
  ANDROID_SDK_ROOT: "/opt/android-sdk-linux"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/

lint:
  stage: lint
  image: ghcr.io/cirruslabs/android-sdk:35
  script:
    - ./gradlew ktlintCheck

unit_tests:
  image: ghcr.io/cirruslabs/android-sdk:35
  stage: unit_tests
  before_script:
    - echo "Cert path:"
    - echo "$SERVER_CERT_BASE64"
    - ls -l "$SERVER_CERT_BASE64" || echo "Cert file not found"
    - mkdir -p app/src/main/res/raw
    - cp "$SERVER_CERT_BASE64" app/src/main/res/raw/server_cert.pem
    - chmod +x ./gradlew
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    - cat local.properties
    - ./gradlew --version
  script:
    - ./gradlew clean testDebugUnitTest --stacktrace
    - cat app/build/reports/tests/testDebugUnitTest/index.html || echo "No test report found"
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/
      - app/build/
  artifacts:
    when: always
    paths:
      - app/build/reports/tests/testDebugUnitTest/
    expire_in: 1 week

integration_tests:
  image: ghcr.io/cirruslabs/android-sdk:35
  stage: integration_tests
  before_script:
    - apt-get update && apt-get install -y curl python3 python3-pip unzip
    - curl https://sdk.cloud.google.com | bash
    - export PATH="$HOME/google-cloud-sdk/bin:$PATH"
    - echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > gcp-key.json
    - gcloud --quiet components update
    - gcloud auth activate-service-account --key-file=gcp-key.json
    - gcloud config set project familyguard-9a355
    - echo "Cert path:"
    - echo "$SERVER_CERT_BASE64"
    - ls -l "$SERVER_CERT_BASE64" || echo "Cert file not found"
    - mkdir -p app/src/main/res/raw
    - cp "$SERVER_CERT_BASE64" app/src/main/res/raw/server_cert.pem
    - ./gradlew assembleDebug assembleAndroidTest
  script:
    - export PATH="$HOME/google-cloud-sdk/bin:$PATH"
    - gcloud firebase test android models list
    - gcloud firebase test android run
      --type instrumentation
      --app app/build/outputs/apk/debug/app-debug.apk
      --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      --device model=redfin,version=30,locale=en,orientation=portrait
  artifacts:
    when: always
    expire_in: 1 week