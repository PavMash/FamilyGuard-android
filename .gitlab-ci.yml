stages:
  - lint
  - unit_tests
  - integration_tests

variables:
  ANDROID_HOME: "/opt/android-sdk-linux"
  ANDROID_SDK_ROOT: "/opt/android-sdk-linux"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/

lint:
  stage: lint
  image: ghcr.io/cirruslabs/android-sdk:35
  script:
    - ./gradlew ktlintCheck

unit_tests:
  image: ghcr.io/cirruslabs/android-sdk:35
  stage: unit_tests
  before_script:
    - echo "Cert path:"
    - echo "$SERVER_CERT_BASE64"
    - ls -l "$SERVER_CERT_BASE64" || echo "Cert file not found"
    - mkdir -p app/src/main/res/raw
    - cp "$SERVER_CERT_BASE64" app/src/main/res/raw/server_cert.pem
    - chmod +x ./gradlew
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    - cat local.properties
    - ./gradlew --version
  script:
    - ./gradlew clean testDebugUnitTest --stacktrace
    - cat app/build/reports/tests/testDebugUnitTest/index.html || echo "No test report found"
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/
      - app/build/
  artifacts:
    when: always
    paths:
      - app/build/reports/tests/testDebugUnitTest/
    expire_in: 1 week

integration_tests:
  image: budtmo/docker-android:latest
  stage: integration_tests
  before_script:
    - export PATH=$PATH:$ANDROID_HOME/emulator
    - export PATH=$PATH:$ANDROID_HOME/tools
    - export PATH=$PATH:$ANDROID_HOME/tools/bin
    - export PATH=$PATH:$ANDROID_HOME/platform-tools
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    - ./gradlew clean assembleDebug
    - sdkmanager "system-images;android-30;google_apis;x86_64"
    - echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64" --force
    - emulator -avd test -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &
    - adb wait-for-device
    - |
      until adb shell getprop sys.boot_completed | grep -m 1 '1'; do
        echo "Waiting for emulator to finish booting..."
        sleep 5
      done
    - adb shell input keyevent 82 &
  script:
    - ./gradlew connectedDebugAndroidTest --stacktrace
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/
      - app/build/
  artifacts:
    when: always
    paths:
      - app/build/reports/androidTests/connected/
    expire_in: 1 week