stages:
  - test

variables:
  ANDROID_HOME: "/sdk"
  ANDROID_SDK_ROOT: "/sdk"
  ANDROID_COMPILE_SDK: "33"
  ANDROID_BUILD_TOOLS: "33.0.2"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/
unit_tests:
  image: ghcr.io/cirruslabs/android-sdk:35
  stage: test
  before_script:
    - chmod +x ./gradlew
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    - ./gradlew --version
  script:
    - ./gradlew clean testDebugUnitTest --stacktrace
    - cat app/build/reports/tests/testDebugUnitTest/index.html || echo "No test report found"
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/
      - app/build/
  artifacts:
    when: always
    paths:
      - app/build/reports/tests/testDebugUnitTest/
    expire_in: 1 week