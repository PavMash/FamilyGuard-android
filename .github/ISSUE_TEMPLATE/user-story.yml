name: "User Story"
description: "File a user story for a new feature or improvement."
title: "[User Story]: "
labels: ["User Story", "Meta: Unknown Priority"]
projects: ["inno-swp-2025/5"]
type: "issue"
body:
  - type: textarea
    id: user-story
    attributes:
      label: "User Story"
      description: |
        Follow the format:
        As a [persona],
        I want to [action]
        so that [benefit].
      value: |
        As a ...
        I want to ...
        so that ...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance Criteria"
      description: |
        Use GIVEN / WHEN / THEN format. You can add multiple ACs.
      value: |
        GIVEN ...
        WHEN ...
        THEN ...
    validations:
      required: true

  - type: textarea
    id: subtasks
    attributes:
      label: "Subtasks"
      description: List the subtasks or links to other issues if needed.
    validations:
      required: false
